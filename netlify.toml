[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24"
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "vite"
# API route paths are declared in netlify/edge-functions/*.ts.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
